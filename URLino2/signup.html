<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon-Themed Sign Up</title>
  <style>
    /* Reset and basic styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      color: #fff;
    }
    /* Full-page background image (neon.jpg) */
    body {
      background: url("neon.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Form container with semi-transparent overlay */
    .auth-container {
      width: 350px;
      background: rgba(0, 0, 0, 0.65); /* Adjust opacity as needed */
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .form-group input:focus {
      outline: 2px solid #ff00d8;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 4px;
      background-color: #ff00d8;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 0 10px #ff00d8;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    button:hover {
      background-color: #00fff7;
      box-shadow: 0 0 15px #00fff7;
    }
    p {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    p a {
      color: #ff00d8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    p a:hover {
      text-decoration: underline;
      color: #00fff7;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Enter your password" required />
      </div>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
    <div id="signupMessage" class="message"></div>
  </div>

  <script>
    // Example sign-up logic (replace with your real auth code)
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value.trim();

      if (!email || !password) {
        signupMessage.textContent = 'Please enter both email and password.';
        signupMessage.style.color = '#ff8080';
        return;
      }

      // Example: dummy success condition
      if (email === 'test@example.com' && password === '1234') {
        signupMessage.textContent = 'Sign up successful!';
        signupMessage.style.color = '#80ff80';
      } else {
        signupMessage.textContent = 'Sign up failed. Please try again.';
        signupMessage.style.color = '#ff8080';
      }
    });
  </script>
</body>
</html>
