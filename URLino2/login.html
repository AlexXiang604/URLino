<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon-Themed Login</title>
  <style>
    /* Reset & Basic Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      color: #fff; /* White text for contrast against neon background */
    }

    /* Full-page background with neon.jpg */
    body {
      background: url("neon.jpg") no-repeat center center fixed;
      background-size: cover; /* Make sure the image covers the entire background */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container for the login form */
    .auth-container {
      width: 350px;
      background: rgba(0, 0, 0, 0.65); 
      /* Semi-transparent black overlay to ensure text is readable 
         - Increase/decrease alpha for more/less transparency */
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      /* A slight background for the input, so the user can see it clearly */
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    /* Optional: highlight input on focus */
    .form-group input:focus {
      outline: 2px solid #ff00d8; /* Neon pink highlight */
    }

    button {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      background-color: #ff00d8; /* Neon pink button */
      color: #000;              /* Dark text on bright button */
      box-shadow: 0 0 10px #ff00d8; /* Neon glow effect */
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    button:hover {
      background-color: #00fff7; /* Switch to neon turquoise on hover */
      box-shadow: 0 0 15px #00fff7;
    }

    p {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    p a {
      color: #ff00d8;
      text-decoration: none;
      font-weight: 500;
    }
    p a:hover {
      text-decoration: underline;
      color: #00fff7;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      /* color inherited from body (white), 
         can be changed dynamically in JS for success/failure messages */
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        />
      </div>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    <div id="loginMessage" class="message"></div>
  </div>

  <!-- Your existing auth.js or other scripts -->
  <script>
    // Example login logic
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        loginMessage.textContent = 'Please enter both email and password.';
        loginMessage.style.color = '#ff8080';
        return;
      }

      // Simple example check
      if (email === 'test@example.com' && password === '1234') {
        loginMessage.textContent = 'Login successful!';
        loginMessage.style.color = '#80ff80';
      } else {
        loginMessage.textContent = 'Invalid credentials. Try again.';
        loginMessage.style.color = '#ff8080';
      }
    });
  </script>

</body>
</html>
