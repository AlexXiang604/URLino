\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon-Themed Login</title>
  <style>
    /* Reset & Basic Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      color: #fff;
    }
    /* Full-page background with neon.jpg */
    body {
      background: url("neon.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Container for the login form */
    .auth-container {
      width: 350px;
      background: rgba(0, 0, 0, 0.65);
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .form-group input:focus {
      outline: 2px solid #ff00d8;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      background-color: #ff00d8;
      color: #000;
      box-shadow: 0 0 10px #ff00d8;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    button:hover {
      background-color: #00fff7;
      box-shadow: 0 0 15px #00fff7;
    }
    p {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    p a {
      color: #ff00d8;
      text-decoration: none;
      font-weight: 500;
    }
    p a:hover {
      text-decoration: underline;
      color: #00fff7;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    <div id="loginMessage" class="message"></div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        loginMessage.textContent = 'Please enter both email and password.';
        loginMessage.style.color = '#ff8080';
        return;
      }

      try {
        const BASE_URL = 'https://urlino-backend-dot-rice-comp-539-spring-2022.uk.r.appspot.com/account'
        const response = await fetch(`${BASE_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json(); // Expecting { message, token }
          // Store the token in localStorage
          localStorage.setItem('token', data.token);
          loginMessage.style.color = '#80ff80';
          loginMessage.textContent = data.message;
          // Redirect to future.html
          window.location.href = 'future.html';
        } else {
          const errorData = await response.json();
          loginMessage.style.color = '#ff8080';
          loginMessage.textContent = errorData.message || 'Invalid credentials. Try again.';
        }
      } catch (error) {
        console.error(error);
        loginMessage.style.color = '#ff8080';
        loginMessage.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>

</body>
</html>
