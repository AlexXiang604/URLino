<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>URLINO - URLs + History</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Monoton&display=swap"
  />
  <style>
    /* Dark/Light CSS from future.html */
    :root {
      --bg-color:       #0D1F2D;
      --sidebar-bg:     #111;
      --widget-bg:      #111;
      --text-color:     #E1E1E1;
      --primary-color:  #FF00D8;
      --secondary-color:#00FFF7;
    }
    body.light-mode {
      --bg-color:       #FFF9C4;
      --sidebar-bg:     #FFFDE7;
      --widget-bg:      #FFFDE7;
      --text-color:     #2D2D2D;
      --primary-color:  #FFE135;
      --secondary-color:#AB47BC;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      transition: background-color 0.4s, color 0.4s;
    }
    .container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1.5rem;
      transition: background-color 0.4s;
    }
    .sidebar .logo {
      font-family: "Monoton", cursive;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-color);
      margin-bottom: 2rem;
      text-shadow: 0 0 10px var(--primary-color),
        0 0 20px var(--primary-color);
      animation: neonFlicker 3s infinite;
    }
    @keyframes neonFlicker {
      0% {
        opacity: 1;
        text-shadow: 0 0 10px var(--primary-color),
          0 0 20px var(--primary-color);
      }
      2% {
        opacity: 0;
        text-shadow: none;
      }
      4% {
        opacity: 1;
        text-shadow: 0 0 10px var(--primary-color),
          0 0 20px var(--primary-color);
      }
      6% {
        opacity: 0;
        text-shadow: none;
      }
      8% {
        opacity: 1;
        text-shadow: 0 0 10px var(--primary-color),
          0 0 20px var(--primary-color);
      }
      10% {
        opacity: 0;
        text-shadow: none;
      }
      15% {
        opacity: 1;
        text-shadow: 0 0 10px var(--primary-color),
          0 0 20px var(--primary-color);
      }
      100% {
        opacity: 1;
      }
    }
    .nav-menu ul {
      list-style: none;
    }
    .nav-menu li {
      padding: 0.75rem 0;
      font-size: 1rem;
      color: var(--secondary-color);
      transition: color 0.4s;
    }
    .nav-menu li a {
      color: var(--secondary-color);
      text-decoration: none;
      transition: color 0.4s;
    }
    .nav-menu li a:hover {
      color: var(--primary-color);
    }
    .nav-menu li.active a {
      font-weight: 600;
      color: var(--primary-color);
    }
    .user-profile {
      margin-top: 2rem;
      border-top: 1px solid var(--primary-color);
      padding-top: 1rem;
      display: flex;
      align-items: center;
      transition: border-color 0.4s;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--secondary-color);
      margin-right: 1rem;
      transition: background-color 0.4s;
    }
    .user-details .name {
      font-weight: 600;
      color: var(--primary-color);
      display: block;
      transition: color 0.4s;
    }
    .user-details .email {
      font-size: 0.85rem;
      color: var(--secondary-color);
      transition: color 0.4s;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      margin-top: 1.5rem;
    }
    .theme-toggle-checkbox {
      display: none;
    }
    .theme-toggle-switch {
      position: relative;
      width: 60px;
      height: 30px;
      background-color: #ccc;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .theme-toggle-switch::before {
      content: "☀";
      position: absolute;
      left: 8px;
      top: 5px;
      font-size: 16px;
      color: #f39c12;
      opacity: 1;
      transition: opacity 0.3s;
    }
    .theme-toggle-switch::after {
      content: "☾";
      position: absolute;
      right: 8px;
      top: 5px;
      font-size: 16px;
      color: #f1c40f;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .theme-toggle-ball {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .theme-toggle-checkbox:checked + .theme-toggle-switch {
      background-color: #2d2d2d;
    }
    .theme-toggle-checkbox:checked + .theme-toggle-switch::before {
      opacity: 0;
    }
    .theme-toggle-checkbox:checked + .theme-toggle-switch::after {
      opacity: 1;
    }
    .theme-toggle-checkbox:checked + .theme-toggle-switch .theme-toggle-ball {
      transform: translateX(30px);
    }
    .main-content {
      flex: 1;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      transition: background-color 0.4s;
    }
    .widgets-container {
      display: flex;
      gap: 2rem;
      justify-content: space-evenly;
      flex-wrap: wrap;
    }
    .widget {
      background-color: var(--widget-bg);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      flex: 1;
      max-width: 1000px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s;
    }
    .widget h2 {
      font-family: "Monoton", cursive;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      font-weight: 400;
      color: var(--primary-color);
      text-shadow: 0 0 5px var(--primary-color);
      transition: color 0.4s;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    thead {
      background-color: var(--primary-color);
      color: var(--bg-color);
      text-transform: uppercase;
    }
    th, td {
      border: 1px solid #555;
      padding: 0.75rem;
    }
    td {
      color: var(--text-color);
    }
    body.light-mode td, body.light-mode th {
      color: var(--text-color);
    }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 4px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.3s, box-shadow 0.3s;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      margin-right: 0.5rem;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: var(--bg-color);
      box-shadow: 0 0 10px var(--primary-color);
    }
    .btn-primary:hover {
      background-color: var(--secondary-color);
      box-shadow: 0 0 20px var(--secondary-color);
    }
    .btn-secondary {
      background-color: var(--secondary-color);
      color: var(--bg-color);
      box-shadow: 0 0 10px var(--secondary-color);
    }
    .btn-secondary:hover {
      background-color: var(--primary-color);
      box-shadow: 0 0 20px var(--primary-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="logo">URLINO</div>
        <nav class="nav-menu">
          <ul>
            <li><a href="future.html">Shorten &amp; Expand</a></li>
            <li><a href="analytics.html">Analytics Dashboard</a></li>
            <li class="active"><a href="#">URLs + History</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="settings.html">Settings</a></li>
          </ul>
        </nav>
      </div>
      <div class="user-profile">
        <div class="user-avatar"></div>
        <div class="user-details">
          <span class="name">Sam Wheeler</span>
          <span class="email">samwheeler@example.com</span>
        </div>
      </div>
      <div class="theme-toggle">
        <input
          type="checkbox"
          id="themeToggleCheckbox"
          class="theme-toggle-checkbox"
          checked
        />
        <label for="themeToggleCheckbox" class="theme-toggle-switch">
          <span class="theme-toggle-ball"></span>
        </label>
      </div>
    </aside>
    <main class="main-content">
      <div class="widgets-container">
        <div class="widget">
          <h2>URLs + History</h2>
          <button id="refreshHistoryBtn" class="btn btn-primary">Refresh</button>
          <table>
            <thead>
              <tr>
                <th>Short Code</th>
                <th>Long URL</th>
                <th>Clicks</th>
                <th>Created At</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Dynamically filled by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
  <script>
    const themeToggleCheckbox = document.getElementById("themeToggleCheckbox");
    if (themeToggleCheckbox) {
      themeToggleCheckbox.addEventListener("change", () => {
        document.body.classList.toggle("light-mode", !themeToggleCheckbox.checked);
      });
    }

    function renderHistoryTable() {
      const tableBody = document.getElementById("historyTableBody");
      if (!tableBody) return;
      tableBody.innerHTML = "";

      for (const shortCode in urlDatabase) {
        const record = urlDatabase[shortCode];
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${shortCode}</td>
          <td>${record.longUrl}</td>
          <td>${record.clicks}</td>
          <td>${record.createdAt}</td>
        `;
        tableBody.appendChild(row);
      }
    }

    const refreshHistoryBtn = document.getElementById("refreshHistoryBtn");
    if (refreshHistoryBtn) {
      refreshHistoryBtn.addEventListener("click", renderHistoryTable);
    }

    window.addEventListener("DOMContentLoaded", renderHistoryTable);
  </script>
</body>
</html>
